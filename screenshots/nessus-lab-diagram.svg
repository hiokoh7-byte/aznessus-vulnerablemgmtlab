<svg width="720" height="440" viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How the Nessus vulnerability scanning lab works</title>
  <desc>Nessus Essentials scans a Windows Server VM two ways — unauthenticated and credentialed — producing findings that are scored by CVSS, remediated, and re-scanned to verify the fix.</desc>

  <rect x="0" y="0" width="720" height="440" fill="#FFFFFF" rx="0"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Nessus Scanner box -->
  <rect x="40" y="150" width="160" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="120" y="185" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#0C447C">Nessus Essentials</text>
  <text x="120" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">Scanner &amp; policy engine</text>

  <!-- Target VM box -->
  <rect x="500" y="150" width="180" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="590" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#2C2C2A">Windows Server VM</text>
  <text x="590" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Target from Lab 1</text>
  <text x="590" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">(Active Directory)</text>

  <!-- Unauthenticated scan arrow -->
  <line x1="200" y1="170" x2="498" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="150" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Unauthenticated scan</text>
  <text x="350" y="164" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888780">ports &amp; exposed services</text>

  <!-- Credentialed scan arrow -->
  <line x1="200" y1="222" x2="498" y2="222" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="350" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">Credentialed scan</text>
  <text x="350" y="259" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#639922">admin login, deep inspection</text>

  <!-- Findings box -->
  <rect x="40" y="300" width="220" height="80" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="150" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#633806">Findings</text>
  <text x="150" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Scored by CVSS</text>
  <text x="150" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">Critical → Info</text>

  <!-- Remediation box -->
  <rect x="300" y="300" width="220" height="80" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="410" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#27500A">Remediate</text>
  <text x="410" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">Apply the fix</text>
  <text x="410" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">(patch, config change)</text>

  <!-- Report box -->
  <rect x="500" y="300" width="180" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="590" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#3C3489">Report</text>
  <text x="590" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">Executive summary</text>
  <text x="590" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#534AB7">or detailed PDF</text>

  <!-- Scanner -> Findings -->
  <line x1="150" y1="240" x2="150" y2="298" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Findings -> Remediate -->
  <line x1="262" y1="340" x2="298" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Remediate -> Report -->
  <line x1="522" y1="340" x2="498" y2="340" stroke="#5F5E5A" stroke-width="0" marker-end="none"/>
  <line x1="520" y1="340" x2="498" y2="340" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)" transform="translate(0,0)"/>

  <!-- Verify loop: Remediate back up to Target VM -->
  <path d="M 460 300 C 460 260, 560 260, 590 242" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-green)"/>
  <text x="560" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">Re-scan to verify</text>

  <!-- Legend -->
  <text x="40" y="420" font-family="sans-serif" font-size="11" fill="#888780">Solid arrows = scan/data flow · Dashed green arrow = remediation verification loop</text>
</svg>
